<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频卡片收藏夹</title>
<meta name="theme-color" content="#0b0b14">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<style>
  :root{
    --bg0:#0a0a12; --bg1:#101024;
    --card:rgba(255,255,255,.045); --card-strong:rgba(255,255,255,.075);
    --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.2);
    --txt:#eef0f8; --sub:#9b9bb8;
    --accent:#7c6cff; --accent2:#4ad8c9; --danger:#ff7a7a;
    --radius:16px; --shadow:0 20px 50px -24px rgba(0,0,0,.85);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;background:var(--bg0)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--txt); min-height:100vh; padding:30px 16px 90px;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(1100px 700px at 10% -12%, rgba(124,108,255,.22), transparent 60%),
      radial-gradient(900px 640px at 102% -4%, rgba(74,216,201,.14), transparent 58%),
      radial-gradient(900px 900px at 50% 118%, rgba(124,108,255,.12), transparent 62%),
      linear-gradient(180deg, var(--bg1) 0%, var(--bg0) 55%);
  }
  .wrap{max-width:760px;margin:0 auto}

  /* 标题 */
  h1.brand{
    display:flex;align-items:center;gap:12px;margin-bottom:24px;
    font-size:21px;font-weight:700;letter-spacing:.2px;
  }
  .brand-badge{
    width:40px;height:40px;border-radius:13px;flex-shrink:0;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 12px 26px -12px rgba(124,108,255,.95);
  }
  .brand-badge svg{width:20px;height:20px;display:block}
  h1.brand .t{background:linear-gradient(92deg,#ffffff 22%,#c9c4ff 92%);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* 玻璃面板 */
  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:16px;box-shadow:var(--shadow);
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
  }

  input[type=url], input[type=text]{
    width:100%;background:rgba(8,8,16,.55);border:1px solid var(--line);border-radius:12px;
    color:var(--txt);padding:12px 14px;font-size:14px;outline:none;transition:.18s;
  }
  input::placeholder{color:#6e6e8d}
  input:focus{border-color:rgba(124,108,255,.8);background:rgba(124,108,255,.07);box-shadow:0 0 0 4px rgba(124,108,255,.12)}

  .addrow{display:flex;gap:10px;flex-wrap:wrap}
  .addrow #urlInput{flex:1 1 260px}
  .addrow #nameInput{flex:0 1 190px}
  .addrow .btn{flex:0 0 auto}

  .btn{
    background:linear-gradient(135deg,var(--accent),#9c8dff);color:#fff;border:none;border-radius:12px;
    padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
    box-shadow:0 14px 28px -14px rgba(124,108,255,1);transition:.18s;
  }
  .btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line);box-shadow:none;font-weight:500}
  .btn.ghost:hover{background:var(--card-strong);border-color:var(--line-strong)}
  .btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
  .btn.ghost.danger{color:#ff9a9a;border-color:rgba(255,122,122,.28)}
  .btn.ghost.danger:hover{background:rgba(255,122,122,.1);border-color:rgba(255,122,122,.5)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .toolbar .spacer{flex:1}

  .list{display:flex;flex-direction:column;gap:20px;margin-top:8px;align-items:center}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:60px 0}

  /* 视频卡片：玻璃质感 + 悬浮 */
  .vcard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;width:100%;max-width:640px;display:flex;flex-direction:column;
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    transition:transform .28s cubic-bezier(.22,1,.36,1), border-color .28s, box-shadow .28s, background .28s;
  }
  .vcard:hover{
    transform:translateY(-4px);
    border-color:rgba(124,108,255,.42);
    background:var(--card-strong);
    box-shadow:0 30px 64px -28px rgba(0,0,0,.92), 0 0 0 1px rgba(124,108,255,.14), 0 22px 60px -34px rgba(124,108,255,.75);
  }
  .vcard.portrait{max-width:280px}

  .cover{position:relative;width:100%;height:0;padding-bottom:56.25%;background:#000;overflow:hidden}
  .cover video{position:absolute;left:0;top:0;display:block;width:100%;height:100%;object-fit:contain;background:#000}
  .cover::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
  .cover .dim{
    position:absolute;right:10px;top:10px;z-index:2;
    background:rgba(8,8,16,.62);color:#d6d6ee;font-size:11px;letter-spacing:.3px;
    padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none;
  }

  .meta{display:flex;align-items:center;gap:10px;padding:13px 15px}
  .info{flex:1;min-width:0}
  .title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:11.5px;color:var(--sub);margin-top:3px}
  .copy{
    background:var(--card-strong);color:var(--txt);border:1px solid var(--line);border-radius:9px;
    padding:7px 13px;font-size:13px;cursor:pointer;flex-shrink:0;transition:.16s;
  }
  .copy:hover{background:rgba(255,255,255,.11);border-color:var(--line-strong)}
  .copy.done{background:rgba(110,231,160,.14);border-color:rgba(110,231,160,.42);color:#6ee7a0}
  .del{
    background:transparent;color:#ff9a9a;border:1px solid rgba(255,122,122,.28);border-radius:9px;
    padding:7px 13px;font-size:13px;cursor:pointer;flex-shrink:0;transition:.16s;
  }
  .del:hover{background:rgba(255,122,122,.1);border-color:rgba(255,122,122,.5)}

  /* 回到顶部按钮 */
  #backTop{
    position:fixed;right:22px;bottom:26px;width:48px;height:48px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;cursor:pointer;font-size:20px;
    box-shadow:0 14px 32px -12px rgba(124,108,255,.95);
    opacity:0;transform:translateY(16px);pointer-events:none;
    transition:opacity .25s, transform .25s;z-index:999;
  }
  #backTop.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #backTop:hover{filter:brightness(1.08)}

  @media (max-width:560px){
    body{padding:22px 12px 90px}
    .addrow #nameInput{flex:1 1 100%}
    .addrow .btn{flex:1 1 100%}
  }
</style>

<body>
<div class="wrap">
  <h1 class="brand">
    <span class="brand-badge" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="#fff"/></svg></span>
    <span class="t">视频卡片收藏夹</span>
  </h1>

  <!-- 添加栏 -->
  <div class="panel">
    <div class="addrow">
      <input id="urlInput" type="url" placeholder="粘贴 MP4 直链…">
      <input id="nameInput" type="text" placeholder="名称（可选）">
      <button class="btn" onclick="addCard()">＋ 添加</button>
    </div>
  </div>

  <!-- 工具栏：排序 + 导入导出 + 清空 -->
  <div class="panel">
    <div class="toolbar">
      <button class="btn ghost sm" id="sortBtn" onclick="toggleSort()">⏱ 最新在前</button>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="exportData()">⬇ 导出</button>
      <button class="btn ghost sm" onclick="document.getElementById('importFile').click()">⬆ 导入</button>
      <button class="btn ghost sm danger" id="clearBtn" onclick="clearAll()">🗑 一键清空</button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <div class="list" id="list">
    <div class="empty">还没有卡片，添加一个试试 👆</div>
  </div>
</div>

<button id="backTop" title="回到顶部">↑</button>

<script>
const STORAGE_KEY = 'videoCardTool_v2';
const BACKUP_KEY  = 'videoCardTool_v2__bak';

// 状态：sortOrder / cards[{id,url,name,w,h,addedAt}]
let state = { sortOrder: 'desc', cards: [] };

function load(){
  let raw = null;
  try{
    raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(BACKUP_KEY);
  }catch(e){ raw = null; }
  if(!raw) return;
  let s = null;
  try{ s = JSON.parse(raw); }
  catch(e){
    try{ s = JSON.parse(localStorage.getItem(BACKUP_KEY)); }catch(_){ s = null; }
  }
  if(s) state = Object.assign({ sortOrder:'desc', cards:[] }, s);
}

let saveWarned = false;
function save(){
  const json = JSON.stringify(state);
  try{
    localStorage.setItem(STORAGE_KEY, json);
    if(localStorage.getItem(STORAGE_KEY) !== json) throw new Error('写入未生效');
    localStorage.setItem(BACKUP_KEY, json);      // 备份一份，防止意外损坏
  }catch(e){
    if(!saveWarned){
      saveWarned = true;
      alert('本地保存失败：' + e.message + '\n浏览器可能禁用了本地存储。');
    }
  }
}

const list = document.getElementById('list');

function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function sortedCards(){
  const arr = state.cards.slice();
  if(state.sortOrder === 'desc') arr.sort((a,b) => b.addedAt - a.addedAt);
  else arr.sort((a,b) => a.addedAt - b.addedAt);
  return arr;
}

function render(){
  updateSortBtn();
  const arr = sortedCards();
  if(arr.length === 0){
    list.innerHTML = '<div class="empty">还没有卡片，添加一个试试 👆</div>';
    return;
  }
  list.innerHTML = '';
  arr.forEach(c => list.appendChild(buildCard(c)));
}

function updateSortBtn(){
  const b = document.getElementById('sortBtn');
  b.textContent = state.sortOrder === 'desc' ? '⏱ 最新在前' : '⏱ 最早在前';
}

function buildCard(c){
  const card = document.createElement('div');
  card.className = 'vcard';

  const cover = document.createElement('div');
  cover.className = 'cover';

  const video = document.createElement('video');
  video.src = c.url;
  video.controls = true;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.preload = 'metadata';

  const dim = document.createElement('div');
  dim.className = 'dim';

  cover.appendChild(video);
  cover.appendChild(dim);

  // 把真实宽高应用到卡片比例（padding-bottom = 高/宽*100%，全浏览器通用）
  const apply = (w, h) => {
    if(!(w > 0 && h > 0)) return;
    cover.style.paddingBottom = (h / w * 100) + '%';
    card.classList.toggle('portrait', h > w);
    dim.textContent = `${w}×${h}`;
  };

  if(c.w > 0 && c.h > 0){
    // 已存过尺寸：直接套用，无需再联网读取
    apply(c.w, c.h);
  }else{
    dim.textContent = '读取中…';
    // 多重事件 + 轮询 + 静音试播兜底（应对不触发 loadedmetadata 的浏览器/省流策略）
    let settled = false, poll = null, timers = [];
    const stop = () => { if(poll) clearInterval(poll); timers.forEach(t => clearTimeout(t)); timers = []; };
    const ok = () => {
      if(settled) return;
      const w = video.videoWidth, h = video.videoHeight;
      if(w > 0 && h > 0){ settled = true; stop(); c.w = w; c.h = h; save(); apply(w, h); }
    };
    const nudge = () => {
      if(settled) return;
      try{ video.currentTime = 0.001; }catch(e){}
      const pm = video.muted;
      try{
        video.muted = true;
        const p = video.play();
        if(p && p.then) p.then(() => { try{ video.pause(); }catch(e){} video.muted = pm; ok(); }).catch(() => { video.muted = pm; });
      }catch(e){ video.muted = pm; }
      ok();
    };
    ['loadedmetadata','loadeddata','durationchange','canplay','canplaythrough','playing','resize'].forEach(ev => video.addEventListener(ev, ok));
    video.addEventListener('error', () => { if(!settled) dim.textContent = '无法加载'; });
    poll = setInterval(ok, 350);
    timers.push(setTimeout(nudge, 3500));
    timers.push(setTimeout(() => { if(!settled) nudge(); }, 7000));
    timers.push(setTimeout(() => { if(!settled){ stop(); if(dim.textContent === '读取中…') dim.textContent = '未读取到尺寸'; } }, 15000));
  }

  // 底部信息条
  const meta = document.createElement('div');
  meta.className = 'meta';

  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = c.name || '(未命名)';
  title.title = c.name || '';
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = '收藏于 ' + fmtTime(c.addedAt);
  info.appendChild(title);
  info.appendChild(time);

  const copy = document.createElement('button');
  copy.className = 'copy';
  copy.textContent = '复制';
  copy.onclick = async () => {
    try{
      await navigator.clipboard.writeText(c.url);
      copy.textContent = '已复制 ✓';
      copy.classList.add('done');
      setTimeout(()=>{ copy.textContent = '复制'; copy.classList.remove('done'); }, 1500);
    }catch(e){
      copy.textContent = '复制失败';
      setTimeout(()=>{ copy.textContent = '复制'; }, 1500);
    }
  };

  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '删除';
  del.onclick = () => {
    state.cards = state.cards.filter(x => x.id !== c.id);
    save();
    render();
  };

  meta.appendChild(info);
  meta.appendChild(copy);
  meta.appendChild(del);
  card.appendChild(cover);
  card.appendChild(meta);
  return card;
}

function addCard(){
  const url = document.getElementById('urlInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  if(!url){
    alert('请先粘贴 MP4 链接');
    return;
  }
  const card = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    url, name, w:0, h:0, addedAt: Date.now()
  };
  state.cards.push(card);
  save();
  document.getElementById('urlInput').value = '';
  document.getElementById('nameInput').value = '';
  render();
}

function toggleSort(){
  state.sortOrder = state.sortOrder === 'desc' ? 'asc' : 'desc';
  save();
  render();
}

// 一键清空
function clearAll(){
  if(state.cards.length === 0){ alert('当前没有卡片'); return; }
  if(!confirm(`确定要删除全部 ${state.cards.length} 个卡片吗？此操作不可恢复。`)) return;
  state.cards = [];
  save();
  render();
}

function exportData(){
  // 导出当前显示顺序（已按 sortOrder 排序）
  const payload = {
    version: 1,
    sortOrder: state.sortOrder,
    exportedAt: new Date().toISOString(),
    cards: sortedCards()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = `视频收藏_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

// 兼容多种历史数据格式：裸数组 / {cards:[...]} / {videoCardTool_v2:{cards:[...]}} / localStorage 原始字符串
function extractImport(data){
  if(Array.isArray(data)) return { sortOrder:'desc', cards:data };
  if(!data || typeof data !== 'object') return null;
  if(Array.isArray(data.cards)) return { sortOrder:data.sortOrder, cards:data.cards };
  for(const k in data){
    const v = data[k];
    if(Array.isArray(v)) return { sortOrder:'desc', cards:v };
    if(v && typeof v === 'object' && Array.isArray(v.cards)) return { sortOrder:v.sortOrder, cards:v.cards };
    if(typeof v === 'string'){
      try{
        const p = JSON.parse(v);
        if(Array.isArray(p)) return { sortOrder:'desc', cards:p };
        if(p && typeof p === 'object' && Array.isArray(p.cards)) return { sortOrder:p.sortOrder, cards:p.cards };
      }catch(e){}
    }
  }
  return null;
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = extractImport(JSON.parse(reader.result));
      if(!parsed){
        alert('文件格式不正确：未找到可导入的卡片数据（cards）');
        return;
      }
      if(!confirm(`即将导入 ${parsed.cards.length} 个视频，将覆盖当前收藏，继续？`)) return;
      state.sortOrder = parsed.sortOrder === 'asc' ? 'asc' : 'desc';
      state.cards = parsed.cards.map(c => ({
        id: c.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
        url: c.url, name: c.name || '', w: Number(c.w)||0, h: Number(c.h)||0, addedAt: Number(c.addedAt) || Date.now()
      }));
      save();
      render();
      alert('导入成功 ✅');
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// 回到顶部按钮：往上滑显示，往下滑隐藏
const backTop = document.getElementById('backTop');
let lastScrollY = window.scrollY;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if(y < lastScrollY && y > 200){
    backTop.classList.add('show');   // 往上滑 → 显示
  } else {
    backTop.classList.remove('show'); // 往下滑 / 接近顶部 → 隐藏
  }
  lastScrollY = y;
}, {passive:true});
backTop.addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});

// 初始化
load();
render();
</script>
</body>
</html>
