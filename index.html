<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>视频收藏夹</title>
<meta name="theme-color" content="#0b0b12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="mask-icon" href="favicon.svg" color="#7c6cff">
<style>
  :root{
    --bg:#0b0b12;
    --card:rgba(255,255,255,.045);
    --card-2:rgba(255,255,255,.07);
    --line:rgba(255,255,255,.09);
    --txt:#eceaf6;
    --sub:#9a97b2;
    --accent:#7c6cff;
    --accent-2:#4ad8c9;
    --danger:#ff6b6b;
    --radius:18px;
    --shadow:0 18px 50px -20px rgba(0,0,0,.75);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--txt); min-height:100vh;
    background:
      radial-gradient(900px 600px at 12% -8%, rgba(124,108,255,.20), transparent 60%),
      radial-gradient(760px 560px at 96% 4%, rgba(74,216,201,.14), transparent 58%),
      radial-gradient(700px 700px at 50% 120%, rgba(124,108,255,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    padding:26px 16px calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto}

  /* 顶部 */
  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:grid;place-items:center;box-shadow:0 8px 22px -8px rgba(124,108,255,.9);
  }
  .logo svg{width:20px;height:20px;display:block}
  h1{font-size:17px;font-weight:600;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}

  .icobtn{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--txt);
    display:grid;place-items:center;transition:.18s;
  }
  .icobtn:hover{background:var(--card-2);border-color:rgba(255,255,255,.18);transform:translateY(-1px)}
  .icobtn:active{transform:translateY(0) scale(.96)}
  .icobtn svg{width:18px;height:18px;display:block}

  /* 添加栏 */
  .addbar{
    display:flex;gap:10px;align-items:stretch;margin-bottom:22px;flex-wrap:wrap;
  }
  .field{flex:1;min-width:150px;position:relative}
  .field input{
    width:100%;height:46px;padding:0 15px;font-size:14px;color:var(--txt);
    background:var(--card);border:1px solid var(--line);border-radius:14px;outline:none;
    transition:.18s;
  }
  .field input::placeholder{color:#6d6a85}
  .field input:focus{border-color:rgba(124,108,255,.85);background:var(--card-2);box-shadow:0 0 0 4px rgba(124,108,255,.13)}
  .btn-add{
    height:46px;padding:0 22px;border-radius:14px;border:none;cursor:pointer;
    font-size:14px;font-weight:600;color:#fff;white-space:nowrap;
    background:linear-gradient(135deg,var(--accent),#9a8bff);
    box-shadow:0 12px 26px -12px rgba(124,108,255,1);
    display:flex;align-items:center;gap:8px;transition:.18s;
  }
  .btn-add:hover{transform:translateY(-1px);filter:brightness(1.06)}
  .btn-add:active{transform:translateY(0) scale(.98)}
  .btn-add svg{width:16px;height:16px}

  /* 列表 */
  .list{display:flex;flex-direction:column;gap:20px;align-items:center}

  .vcard{
    width:100%;max-width:600px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);
    animation:rise .45s cubic-bezier(.22,1,.36,1) both;
    transition:border-color .2s, transform .2s;
  }
  .vcard:hover{border-color:rgba(255,255,255,.16)}
  .vcard.portrait{max-width:330px}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* 封面：padding-bottom 比例方案，全浏览器通吃 */
  .cover{
    position:relative;height:0;width:100%;padding-bottom:56.25%;
    background:#000;overflow:hidden;
  }
  .cover video{
    position:absolute;left:0;top:0;width:100%;height:100%;
    object-fit:contain;background:#000;display:block;
  }
  .cover .shimmer{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.06) 45%,transparent 70%);
    background-size:220% 100%;animation:sheen 1.4s linear infinite;
  }
  @keyframes sheen{from{background-position:160% 0}to{background-position:-60% 0}}
  .cover.ready .shimmer{display:none}

  /* 中央播放按钮 */
  .playbtn{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;z-index:1;
    background:rgba(12,12,20,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#fff;display:grid;place-items:center;transition:opacity .25s, transform .25s;
    box-shadow:0 8px 24px -8px rgba(0,0,0,.8);
  }
  .playbtn svg{width:24px;height:24px;margin-left:3px}
  .playbtn:hover{background:rgba(124,108,255,.88)}
  .playbtn.hide{opacity:0;transform:translate(-50%,-50%) scale(.82);pointer-events:none}

  .chip{
    position:absolute;right:9px;top:9px;z-index:2;pointer-events:none;
    background:rgba(10,10,18,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    color:#d8d5ea;font-size:11px;font-weight:500;letter-spacing:.3px;
    padding:3px 9px;border-radius:20px;border:1px solid rgba(255,255,255,.10);
    transition:opacity .3s;
  }
  .chip.pending{color:#8f8ca8}
  .chip.err{color:#ff9d9d;border-color:rgba(255,107,107,.35);pointer-events:auto}

  /* 元信息 */
  .meta{display:flex;align-items:center;gap:10px;padding:13px 15px}
  .info{flex:1;min-width:0}
  .title{font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .time{font-size:11.5px;color:var(--sub);margin-top:3px}
  .tools{display:flex;gap:8px;flex-shrink:0}
  .tbtn{
    width:34px;height:34px;border-radius:10px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--sub);display:grid;place-items:center;transition:.16s;
  }
  .tbtn:hover{background:var(--card-2);color:var(--txt);border-color:rgba(255,255,255,.18)}
  .tbtn:active{transform:scale(.94)}
  .tbtn svg{width:16px;height:16px;display:block}
  .tbtn.ok{color:#6ee7a0;border-color:rgba(110,231,160,.4)}
  .tbtn.del:hover{color:var(--danger);border-color:rgba(255,107,107,.4);background:rgba(255,107,107,.08)}

  /* 空状态 */
  .empty{
    text-align:center;color:var(--sub);padding:70px 20px;width:100%;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  .empty svg{width:46px;height:46px;opacity:.4}
  .empty p{font-size:13.5px}

  /* 存储受限提示 */
  .notice{
    display:flex;align-items:flex-start;gap:9px;margin:0 0 18px;
    background:rgba(124,108,255,.12);border:1px solid rgba(124,108,255,.32);
    color:#cfc9ff;font-size:12.5px;line-height:1.55;padding:10px 14px;border-radius:12px;
  }

  /* 诊断面板 */
  .debug{
    position:fixed;left:10px;bottom:10px;max-width:92vw;z-index:999;
    background:rgba(10,10,18,.96);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;font-size:11px;line-height:1.75;color:#c9c6dd;word-break:break-all;
    font-family:ui-monospace,Menlo,Consolas,monospace;box-shadow:var(--shadow);
  }
  .debug b{color:#fff}

  /* 回到顶部 */
  #backTop{
    position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));
    width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;z-index:99;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 12px 28px -10px rgba(124,108,255,.95);
    display:grid;place-items:center;opacity:0;transform:translateY(14px);pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #backTop.show{opacity:1;transform:none;pointer-events:auto}
  #backTop svg{width:20px;height:20px}

  /* toast */
  #toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:rgba(20,20,32,.94);border:1px solid var(--line);color:var(--txt);
    padding:10px 18px;border-radius:14px;font-size:13px;z-index:200;
    opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(10px);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:420px){
    body{padding:18px 12px calc(90px + env(safe-area-inset-bottom))}
    .addbar{gap:8px}
    .field input{height:44px}
    .btn-add{width:100%;justify-content:center}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5-11-6.5Z" fill="#fff"/></svg>
      </span>
      <h1>视频收藏夹<span class="count" id="count"></span></h1>
    </div>
    <button class="icobtn" id="sortBtn" title="切换排序"><svg id="sortIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h12M3 12h8M3 18h4"/><path d="M17 8v8m0 0 3-3m-3 3-3-3"/></svg></button>
    <button class="icobtn" title="导出" onclick="exportData()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
    <button class="icobtn" title="导入" onclick="document.getElementById('importFile').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0 4 4m-4-4-4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importData(event)">
  </div>

  <div class="addbar">
    <div class="field"><input id="urlInput" type="url" inputmode="url" placeholder="粘贴 MP4 直链…"></div>
    <div class="field"><input id="nameInput" type="text" placeholder="名称（可选）"></div>
    <button class="btn-add" onclick="addCard()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>添加
    </button>
  </div>

  <div class="list" id="list"></div>
</div>

<button id="backTop" title="回到顶部"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg></button>
<div id="toast"></div>

<script>
const STORAGE_KEY = 'videoCardTool_v2';
const BACKUP_KEY  = 'videoCardTool_v2__bak';

// 状态：sortOrder / cards[{id,url,name,w,h,addedAt}]
let state = { sortOrder: 'desc', cards: [], updatedAt: 0 };

// ---- 存储：只用浏览器本地存储(localStorage)。写入后立即回读校验，并保留一份备份 ----
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return lsGet(k) === v; }catch(e){ return false; } }

let storageOK = (function(){
  try{
    const probe = '__probe__' + Date.now();
    localStorage.setItem(probe, '1');
    const ok = localStorage.getItem(probe) === '1';
    localStorage.removeItem(probe);
    return ok;
  }catch(e){ return false; }
})();

let saveWarned = false;
function load(){
  const raw = lsGet(STORAGE_KEY) || lsGet(BACKUP_KEY);
  if(!raw) return;
  let s = null;
  try{ s = JSON.parse(raw); }
  catch(e){ try{ s = JSON.parse(lsGet(BACKUP_KEY)); }catch(_){ s = null; } }
  if(s) state = Object.assign({ sortOrder:'desc', cards:[], updatedAt:0 }, s);
}
function save(){
  state.updatedAt = Date.now();
  const json = JSON.stringify(state);
  if(lsSet(STORAGE_KEY, json)){
    lsSet(BACKUP_KEY, json);          // 备份，防止主数据被意外损坏
    return true;
  }
  if(!saveWarned){ saveWarned = true; toast('本地保存失败：浏览器可能禁用了本地存储'); }
  return false;
}

const list = document.getElementById('list');

function fmtTime(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function sortedCards(){
  const arr = state.cards.slice();
  if(state.sortOrder === 'desc') arr.sort((a,b) => b.addedAt - a.addedAt);
  else arr.sort((a,b) => a.addedAt - b.addedAt);
  return arr;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function render(){
  updateSortBtn();
  const arr = sortedCards();
  document.getElementById('count').textContent = arr.length ? `· ${arr.length}` : '';
  if(arr.length === 0){
    list.innerHTML = '<div class="empty">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9.5v5l4.5-2.5-4.5-2.5Z"/></svg>'
      + '<p>还没有收藏，粘贴一个 MP4 直链试试</p></div>';
    return;
  }
  list.innerHTML = '';
  arr.forEach(c => list.appendChild(buildCard(c)));
}

function updateSortBtn(){
  const b = document.getElementById('sortBtn');
  const icon = document.getElementById('sortIcon');
  b.title = state.sortOrder === 'desc' ? '当前：最新在前' : '当前：最早在前';
  // 箭头方向随排序变化
  icon.innerHTML = state.sortOrder === 'desc'
    ? '<path d="M3 6h12M3 12h8M3 18h4"/><path d="M17 16V8m0 0 3 3m-3-3-3 3"/>'
    : '<path d="M3 6h12M3 12h8M3 18h4"/><path d="M17 8v8m0 0 3-3m-3 3-3-3"/>';
}

// 核心：把真实宽高应用到卡片（用 padding-bottom 百分比 = 高/宽，全浏览器通用）
function applyAspect(cover, card, w, h){
  if(!(w > 0 && h > 0)) return;
  cover.style.paddingBottom = (h / w * 100).toFixed(4) + '%';
  card.classList.toggle('portrait', h > w);
}

function buildCard(c){
  const card = document.createElement('div');
  card.className = 'vcard';

  const cover = document.createElement('div');
  cover.className = 'cover';

  const video = document.createElement('video');
  video.src = c.url;
  video.controls = true;
  video.playsInline = true;
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');
  video.preload = 'metadata';

  const shimmer = document.createElement('div');
  shimmer.className = 'shimmer';

  const chip = document.createElement('div');
  chip.className = 'chip pending';

  // 中央播放按钮
  const playBtn = document.createElement('button');
  playBtn.className = 'playbtn';
  playBtn.title = '播放';
  playBtn.setAttribute('aria-label','播放');
  playBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5Z"/></svg>';
  playBtn.onclick = e => { e.preventDefault(); e.stopPropagation(); const p = video.play(); if(p && p.catch) p.catch(()=>{}); };

  cover.appendChild(video);
  cover.appendChild(shimmer);
  cover.appendChild(playBtn);
  cover.appendChild(chip);

  // 播放优化：同一时间只播放一个；滚出视野自动暂停；播放时隐藏中央按钮
  video.addEventListener('play', () => {
    document.querySelectorAll('video').forEach(v => { if(v !== video && !v.paused){ try{ v.pause(); }catch(e){} } });
    playBtn.classList.add('hide');
  });
  video.addEventListener('pause', () => playBtn.classList.remove('hide'));
  video.addEventListener('ended', () => playBtn.classList.remove('hide'));
  if('IntersectionObserver' in window){
    new IntersectionObserver(ents => {
      ents.forEach(e => { if(!e.isIntersecting && !video.paused){ try{ video.pause(); }catch(err){} } });
    }, { threshold: 0 }).observe(cover);
  }

  // ---- 尺寸处理：只要已知道尺寸就直接套用、不再联网测量，徽标永远显示真实尺寸 ----
  if(c.w > 0 && c.h > 0){
    applyAspect(cover, card, c.w, c.h);
    chip.textContent = `${c.w}×${c.h}`;
    chip.classList.remove('pending');
    cover.classList.add('ready');
  }else{
    chip.textContent = '读取中';
    measure();
  }

  // 读真实尺寸：多重事件 + 轮询 + 静音试播兜底，并永久记住（应对不触发 loadedmetadata 的内核/省流策略）
  function measure(){
    let settled = false, pollTimer = null, timers = [];
    const clearTimers = () => { if(pollTimer) clearInterval(pollTimer); timers.forEach(t => clearTimeout(t)); timers = []; };

    const ok = () => {
      if(settled) return true;
      const w = video.videoWidth, h = video.videoHeight;
      if(w > 0 && h > 0){
        settled = true; clearTimers();
        c.w = w; c.h = h; save();
        applyAspect(cover, card, w, h);
        chip.textContent = `${w}×${h}`;
        chip.classList.remove('pending','err');
        chip.style.pointerEvents = 'none';
        chip.style.cursor = 'default';
        cover.classList.add('ready');
        return true;
      }
      return false;
    };

    // 温和地"逼"内核解出元数据：定位到极短时间点 + 静音自动播放后立即暂停
    const nudge = () => {
      if(settled) return;
      try{ video.currentTime = 0.001; }catch(e){}
      const prevMuted = video.muted;
      try{
        video.muted = true;
        const p = video.play();
        if(p && p.then){
          p.then(() => { try{ video.pause(); }catch(e){} video.muted = prevMuted; ok(); })
           .catch(() => { video.muted = prevMuted; });
        }
      }catch(e){ video.muted = prevMuted; }
      ok();
    };

    const fail = () => {
      if(settled) return;
      if(c.w > 0 && c.h > 0){ applyAspect(cover, card, c.w, c.h); return; } // 有缓存就直接用
      settled = true; clearTimers();
      chip.textContent = '读取失败 · 点击重试';
      chip.classList.add('err');
      chip.classList.remove('pending');
      chip.style.pointerEvents = 'auto';
      chip.style.cursor = 'pointer';
      cover.classList.add('ready');
    };

    // 临时网络错误不判死，交给轮询与超时处理
    const onErr = () => {};
    const arm = () => {
      clearTimers(); settled = false;
      pollTimer = setInterval(ok, 350);
      timers.push(setTimeout(nudge, 3500));
      timers.push(setTimeout(() => { if(!settled) nudge(); }, 7000));
      timers.push(setTimeout(fail, 12000));
    };

    ['loadedmetadata','loadeddata','durationchange','canplay','canplaythrough','playing','resize'].forEach(ev =>
      video.addEventListener(ev, ok));
    video.addEventListener('error', onErr);
    arm();

    // 点徽标可重试
    chip.addEventListener('click', () => {
      if(settled && !chip.classList.contains('err')) return;
      chip.textContent = '读取中';
      chip.classList.remove('err');
      chip.classList.add('pending');
      chip.style.pointerEvents = 'none';
      try{ video.load(); }catch(e){}
      arm();
    });
  }

  // 底部信息条
  const meta = document.createElement('div');
  meta.className = 'meta';

  const info = document.createElement('div');
  info.className = 'info';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = c.name || '(未命名)';
  title.title = c.name || '';
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = '收藏于 ' + fmtTime(c.addedAt);
  info.appendChild(title);
  info.appendChild(time);

  const copy = document.createElement('button');
  copy.className = 'tbtn';
  copy.title = '复制链接';
  copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.4"/><path d="M5 15H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg>';
  copy.onclick = async () => {
    try{
      await navigator.clipboard.writeText(c.url);
      copy.classList.add('ok');
      toast('已复制链接');
      setTimeout(()=>copy.classList.remove('ok'), 1200);
    }catch(e){
      // 兜底：兼容不支持 clipboard API 的内核
      try{
        const ta = document.createElement('textarea');
        ta.value = c.url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        copy.classList.add('ok'); toast('已复制链接');
        setTimeout(()=>copy.classList.remove('ok'), 1200);
      }catch(err){ toast('复制失败'); }
    }
  };

  const del = document.createElement('button');
  del.className = 'tbtn del';
  del.title = '删除';
  del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/></svg>';
  del.onclick = () => {
    if(!confirm('删除这张卡片？')) return;
    state.cards = state.cards.filter(x => x.id !== c.id);
    save();
    render();
  };

  meta.appendChild(info);
  const tools = document.createElement('div');
  tools.className = 'tools';
  tools.appendChild(copy);
  tools.appendChild(del);
  meta.appendChild(tools);

  card.appendChild(cover);
  card.appendChild(meta);
  return card;
}

function addCard(){
  const url = document.getElementById('urlInput').value.trim();
  const name = document.getElementById('nameInput').value.trim();
  if(!url){
    toast('请先粘贴 MP4 链接');
    return;
  }
  const card = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    url, name, w:0, h:0, addedAt: Date.now()
  };
  state.cards.push(card);
  save();
  document.getElementById('urlInput').value = '';
  document.getElementById('nameInput').value = '';
  render();
  window.scrollTo({top: document.body.scrollHeight, behavior:'smooth'});
}

function toggleSort(){
  state.sortOrder = state.sortOrder === 'desc' ? 'asc' : 'desc';
  save();
  render();
}

/* ===== 导出 / 导入：保持与旧版完全一致的格式，确保兼容 ===== */
function exportData(){
  // 导出当前显示顺序（已按 sortOrder 排序）
  const payload = {
    version: 1,
    sortOrder: state.sortOrder,
    exportedAt: new Date().toISOString(),
    cards: sortedCards()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = `视频收藏_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function importData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.cards)){
        alert('文件格式不正确，缺少 cards 字段');
        return;
      }
      if(!confirm(`即将导入 ${data.cards.length} 个视频，将覆盖当前收藏，继续？`)) return;
      state.sortOrder = data.sortOrder === 'asc' ? 'asc' : 'desc';
      state.cards = data.cards.map(c => ({
        id: c.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
        url: c.url, name: c.name || '', w: c.w||0, h: c.h||0, addedAt: c.addedAt || Date.now()
      }));
      save();
      render();
      alert('导入成功 ✅');
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

// 回到顶部按钮：往上滑显示，往下滑隐藏
const backTop = document.getElementById('backTop');
let lastScrollY = window.scrollY;
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if(y < lastScrollY && y > 200){
    backTop.classList.add('show');   // 往上滑 → 显示
  } else {
    backTop.classList.remove('show'); // 往下滑 / 接近顶部 → 隐藏
  }
  lastScrollY = y;
}, {passive:true});
backTop.addEventListener('click', () => {
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('sortBtn').addEventListener('click', toggleSort);

// 初始化
load();
render();

// 存储不可用时的提示
if(!storageOK){
  const n = document.createElement('div');
  n.className = 'notice';
  n.textContent = '当前浏览器禁用了本地存储，收藏将无法保存。请退出无痕模式，或允许本站存储数据。';
  document.querySelector('.wrap').insertBefore(n, document.getElementById('list'));
}

// 诊断面板：在网址后加 ?debug=1 打开，用于排查存储问题
if(/[?&]debug=1(&|$)/.test(location.search)){
  let canWrite = false, bytes = -1;
  try{
    localStorage.setItem('__t', 'x');
    canWrite = localStorage.getItem('__t') === 'x';
    localStorage.removeItem('__t');
    bytes = (localStorage.getItem(STORAGE_KEY) || '').length;
  }catch(e){ canWrite = false; bytes = -1; }
  const d = document.createElement('div');
  d.className = 'debug';
  d.innerHTML = '<b>存储诊断</b><br>'
    + 'origin: ' + location.origin + '<br>'
    + 'storageOK: ' + storageOK + '<br>'
    + 'localStorage 读写: ' + (canWrite ? '正常' : '失败') + '<br>'
    + '已存数据字节: ' + bytes + '<br>'
    + '卡片数: ' + state.cards.length + '<br>'
    + 'UA: ' + navigator.userAgent;
  document.body.appendChild(d);
}
</script>
